name: Main CI/CD

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  call-docker-build:
    uses: ycpss91255-lab/base/.github/workflows/build-worker.yaml@8a95dbe5dda277c0f676b9be0b5a01e1903b2f8a
    with:
      image_name: urg_node_humble
      build_runtime: false

  call-release:
    needs: call-docker-build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: ycpss91255-lab/base/.github/workflows/release-worker.yaml@8a95dbe5dda277c0f676b9be0b5a01e1903b2f8a
    with:
      archive_name_prefix: urg_node_humble
